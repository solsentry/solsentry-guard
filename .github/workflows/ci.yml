# CI template for @solsentry/guard.
# NOT active here (GitHub only reads .github/workflows/*.yml). Move to
# .github/workflows/ci.yml when the SDK is extracted to its own repo, so it
# doesn't interfere with the monorepo's existing CI.
name: guard-ci
on:
  push:
    paths: ["**"]
  pull_request:
    paths: ["**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
